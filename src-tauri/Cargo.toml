[package]
name = "easymd"
version = "0.4.5"
description = "EasyMD - 本地优先 Markdown 知识库"
authors = ["easymd"]
edition = "2021"

[lib]
name = "easymd_lib"
# 仅桌面 Windows：cdylib 仅供移动端打包使用，且 rustc 在 windows-gnu 工具链下会为
# cdylib 生成超过 PE 65535 导出符号上限的 .def 导致链接失败，故不构建
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
walkdir = "2"
regex = "1"
pulldown-cmark = "0.13"
trash = "5"
sha2 = "0.10"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
percent-encoding = "2"
url = "2"
tiny_http = "0.12"
base64 = "0.22"
if-addrs = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# 发布构建：小体积优先
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
