name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            kind: windows
          - os: macos-latest
            platform: macos-arm64
            kind: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
            kind: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:share
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Windows x64 runner
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw "Expected Windows x64 runner; got $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          }
      - name: Build Windows NSIS installer
        if: matrix.kind == 'windows'
        run: npm run tauri build -- --ci
      - name: Package Windows portable ZIP
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./scripts/package-windows-portable.ps1 `
            -BinaryPath 'src-tauri/target/release/EasyMD.exe' `
            -LicensePath 'LICENSE' `
            -OutputDirectory 'artifacts/portable' `
            -Version $version
      - name: Build macOS app and DMG
        if: startsWith(matrix.kind, 'macos-')
        run: npm run tauri build -- --config src-tauri/tauri.macos.conf.json --ci
      - name: Verify macOS architecture and rebuild signed disk image
        if: startsWith(matrix.kind, 'macos-')
        shell: bash
        env:
          PLATFORM_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          case "$PLATFORM_KIND" in
            macos-arm64)
              expected_arch=arm64
              target_arch=aarch64
              ;;
            macos-x64)
              expected_arch=x86_64
              target_arch=x64
              ;;
            *)
              echo "Unexpected macOS matrix kind: $PLATFORM_KIND" >&2
              exit 1
              ;;
          esac
          actual_arch=$(uname -m)
          test "$actual_arch" = "$expected_arch"
          app=src-tauri/target/release/bundle/macos/EasyMD.app
          binary="$app/Contents/MacOS/EasyMD"
          test -f "$binary"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          lipo -archs "$binary" | tr ' ' '\n' | grep -Fxq "$expected_arch"
          stage=$(mktemp -d)
          ditto "$app" "$stage/EasyMD.app"
          codesign --force --deep --sign - "$stage/EasyMD.app"
          codesign --verify --deep --strict "$stage/EasyMD.app"
          ln -s /Applications "$stage/Applications"
          dmg="src-tauri/target/release/bundle/dmg/EasyMD_${version}_${target_arch}.dmg"
          hdiutil create -volname EasyMD -srcfolder "$stage" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
      - name: Stage Windows installers
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/windows/
          Copy-Item artifacts/portable/*.zip artifacts/windows/
      - name: Upload Windows installers
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: EasyMD-${{ matrix.platform }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS DMG
        if: startsWith(matrix.kind, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: EasyMD-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
