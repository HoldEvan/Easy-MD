name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            args: ''
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos-arm64
            args: --config src-tauri/tauri.macos.conf.json
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:share
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- ${{ matrix.args }}
      - name: Verify macOS architecture and rebuild signed disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          stage=$(mktemp -d)
          ditto src-tauri/target/release/bundle/macos/EasyMD.app "$stage/EasyMD.app"
          codesign --force --deep --sign - "$stage/EasyMD.app"
          codesign --verify --deep --strict "$stage/EasyMD.app"
          ln -s /Applications "$stage/Applications"
          version=$(node -p "require('./package.json').version")
          hdiutil create -volname EasyMD -srcfolder "$stage" -ov -format UDZO "src-tauri/target/release/bundle/dmg/EasyMD_${version}_aarch64.dmg"
          hdiutil verify "src-tauri/target/release/bundle/dmg/EasyMD_${version}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMD-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
