<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问知识库</title>
  <link rel="stylesheet" href="/share.css">
  <style>
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body { margin: 0; background: var(--background-primary, Canvas); color: var(--text-normal, CanvasText); font: 13px var(--font-ui, Inter, "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif); }
    input, button, select { color: inherit; font: inherit; border: 1px solid var(--background-modifier-border, ButtonBorder); border-radius: var(--radius-s, 4px); padding: 6px 8px; background: var(--interactive-normal, ButtonFace); }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--interactive-accent, Highlight); outline-offset: 2px; }
    [role="alert"] { color: var(--text-error, CanvasText); }
  </style>
</head>
<body>
  <main style="max-width:320px;margin:15vh auto;padding:20px;background:var(--background-secondary);border-radius:12px">
    <label style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span data-login-i18n="language">语言</span><select id="login-language" aria-label="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
    <h2 data-login-i18n="title">访问知识库</h2>
    <p data-login-i18n="prompt">请输入分享密码</p>
    <form action="/login" method="post">
      <input id="share-password" name="password" type="password" aria-label="分享密码" placeholder="分享密码" autocomplete="current-password" required autofocus style="width:100%;box-sizing:border-box">
      <button data-login-i18n="submit" type="submit" style="margin-top:12px;width:100%">登录</button>
    </form>
    <p id="login-error" role="alert">{{error}}</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
